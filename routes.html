<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitWay - Strategic Route Network</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard-style.css?v=20.5">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="i18n.js?v=1.1"></script>
    <script src="user-dropdown.js"></script>
    <style>
        .route-stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .data-table th, .data-table td { padding: 18px 15px; border-bottom: 1px solid var(--border-color); }
        .route-num-badge { background: rgba(59, 130, 246, 0.1); color: #3b82f6; padding: 6px 12px; border-radius: 8px; font-weight: 800; font-family: monospace; display: inline-flex; align-items: center; gap: 6px; }
        .station-pills-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
        .station-pill { background: var(--bg-main); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 4px; }
        .station-pill i { color: var(--primary-color); font-size: 0.65rem; }
        .status-pill-wrap { display: flex; align-items: center; gap: 8px; }
        .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: #dc2626; position: relative; }
        .pulse-dot.active { background: #059669; box-shadow: 0 0 0 rgba(5, 150, 105, 0.4); animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(5, 150, 105, 0); } 100% { box-shadow: 0 0 0 0 rgba(5, 150, 105, 0); } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 3000; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--bg-card); padding: 30px; border-radius: 24px; width: 450px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="11fc662484192f59b3906d1d5669228f9f707453.png" alt="Logo">
                <h1 data-i18n="brand_name">TRANSITWAY</h1>
            </div>
            <nav class="nav-group">
                <a href="dashboard.html" data-i18n="dashboard" class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="map.html" data-i18n="live_map" class="nav-link"><i class="fas fa-map-marked-alt"></i> Live Map</a>
                <a href="admins.html" data-i18n="admins" class="nav-link"><i class="fas fa-user-shield"></i> Admins</a>
                <a href="buses.html" data-i18n="buses" class="nav-link"><i class="fas fa-bus"></i> Buses</a>
                <a href="drivers.html" data-i18n="drivers" class="nav-link"><i class="fas fa-users"></i> Drivers</a>
                <a href="stations.html" data-i18n="stations" class="nav-link"><i class="fas fa-map-marker-alt"></i> Stations</a>
                <a href="tickets.html" data-i18n="tickets" class="nav-link"><i class="fas fa-ticket-alt"></i> Tickets</a>
                <a href="routes.html" data-i18n="routes" class="nav-link active"><i class="fas fa-route"></i> Routes</a>
                <a href="reports.html" data-i18n="reports" class="nav-link"><i class="fas fa-exclamation-triangle"></i> Reports</a>
                <a href="users.html" data-i18n="users" class="nav-link"><i class="fas fa-user-friends"></i> Users</a>
            </nav>
        <div class="sidebar-footer">
                <nav class="nav-group">
                    <a href="settings.html" data-i18n="settings" class="nav-link"><i class="fas fa-cog"></i> Settings</a>
                    <a onclick="confirmLogout()" data-i18n="logout" class="nav-link" style="cursor:pointer; color:#ef4444;"><i class="fas fa-sign-out-alt"></i> Log Out</a>
                </nav>
            </div>
        </aside>

        <main class="main-viewport">
            <header class="top-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                    <h2 data-i18n="routes">Strategic Route Network</h2>
                </div>
                <div class="header-right">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="routeSearchInput" placeholder="Search routes or zones...">
                    </div>
                    <div class="profile-pill dropdown-trigger">
                        <img id="topAvatar" src="https://ui-avatars.com/api/?name=Admin&background=568e74&color=fff">
                        <span id="topBarName">Admin</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </header>

            <div class="route-stats-bar">
                <div class="v-card"><p style="font-size:0.7rem; color:var(--text-muted); font-weight:800; text-transform:uppercase;">TOTAL ROUTES</p><h3 id="rtStatTotal">0</h3></div>
                <div class="v-card"><p style="font-size:0.7rem; color:var(--text-muted); font-weight:800; text-transform:uppercase;">ACTIVE</p><h3 id="rtStatActive" style="color:#10b981;">0</h3></div>
                <div class="v-card"><p style="font-size:0.7rem; color:var(--text-muted); font-weight:800; text-transform:uppercase;">OFFLINE</p><h3 id="rtStatInactive" style="color:#ef4444;">0</h3></div>
                <div class="v-card"><p style="font-size:0.7rem; color:var(--text-muted); font-weight:800; text-transform:uppercase;">TOTAL STATIONS</p><h3 id="rtStatStations" style="color:#8b5cf6;">0</h3></div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
                <h4 style="font-weight: 800;">Navigation Network Directory</h4>
                <button class="btn-primary" onclick="openModal('addRouteModal')"><i class="fas fa-plus"></i> Define New Route</button>
            </div>

            <section class="v-card" style="padding: 0; overflow: hidden;">
                <table class="data-table" style="width: 100%;">
                    <thead style="background: var(--bg-main);">
                        <tr>
                            <th>ID</th><th>Number</th><th>Route Name</th><th>Zone</th><th>Main Stations</th><th>Status</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="routeTableBody"></tbody>
                </table>
            </section>
        </main>
    </div>

    
    <div class="modal-overlay" id="addRouteModal">
        <div class="modal-card">
            <h2>Add New Route</h2>
            <form id="addRouteForm">
                <div class="modal-input" style="margin-bottom:12px;"><input type="text" id="routeNumberInput" placeholder="Route Number (e.g., 50)" required style="width:100%; border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-main); font-weight:600; padding:12px; border-radius:12px;"></div>
                <div class="modal-input" style="margin-bottom:12px;"><input type="text" id="routeNameInput" placeholder="Route Name" required style="width:100%; border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-main); font-weight:600; padding:12px; border-radius:12px;"></div>
                <div class="modal-actions" style="display:flex; gap:10px;"><button type="submit" class="btn-primary" style="flex:1;">Define Route</button><button type="button" class="btn-outline" onclick="closeModal('addRouteModal')" style="flex:1;">Cancel</button></div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth.js"></script>
    <script src="routes-logic.js?v=2.2"></script>
    <script>function openModal(id){document.getElementById(id).classList.add('active');}function closeModal(id){document.getElementById(id).classList.remove('active');}</script>
<script src="notifications.js?v=2.0"></script>
</body>
</html>
