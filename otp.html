<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitWay - Verify OTP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css?v=1.2">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="theme-init.js"></script>
</head>
<body>

    <button id="themeToggle" class="auth-theme-toggle" title="Toggle Theme">
        <i class="fas fa-moon"></i>
    </button>
    <button id="langToggle" class="auth-theme-toggle" title="Toggle Language" style="right: 80px;">
        <i class="fas fa-language"></i>
    </button>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="form-side">
                <div class="brand-header">
                    <img src="11fc662484192f59b3906d1d5669228f9f707453.png" alt="TransitWay" class="main-logo">
                </div>

                <div class="login-box">
                    <button class="back-btn" onclick="window.location.href='forgot.html'">
                        <i class="fas fa-chevron-left"></i> Back
                    </button>
                    
                    <h1>Enter Verification Code</h1>
                    <p class="subtitle">Please enter the 6-digit OTP sent to <span id="displayEmail" style="color: var(--primary-color); font-weight: 700;">your device</span></p>

                    <div class="otp-container">
                        <input type="text" maxlength="1" class="otp-input" pattern="[0-9]*" inputmode="numeric" required>
                        <input type="text" maxlength="1" class="otp-input" pattern="[0-9]*" inputmode="numeric" required>
                        <input type="text" maxlength="1" class="otp-input" pattern="[0-9]*" inputmode="numeric" required>
                        <input type="text" maxlength="1" class="otp-input" pattern="[0-9]*" inputmode="numeric" required>
                        <input type="text" maxlength="1" class="otp-input" pattern="[0-9]*" inputmode="numeric" required>
                        <input type="text" maxlength="1" class="otp-input" pattern="[0-9]*" inputmode="numeric" required>
                    </div>

                    <button type="button" id="verifyBtn" class="btn-continue">
                        Verify Code <i class="fas fa-check-circle"></i>
                    </button>
                    
                    <p class="resend-text">
                        Didn't receive the code? 
                        <a href="#" id="resendBtn" class="disabled">Resend Code in <span id="countdown">60</span>s</a>
                    </p>
                </div>
            </div>

            <div class="image-side">
                <div class="gov-header">
                    <img src="aad2dd876dee8682b5a218c7eae46b04e55935c5.png" alt="Government" class="gov-logo-img">
                </div>

                <div class="illustration-box">
                    <img src="7e561f202f13163960fe1b516ad6fb55c2378e30.png" alt="Verify Illustration">
                </div>

                <div class="glass-welcome">
                    <h3>One Step Closer!</h3>
                    <p>Verification helps us keep your account safe and secure. Please do not share this code with anyone.</p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="otp.js"></script>
    <script src="i18n.js"></script>
</body>
</html>
