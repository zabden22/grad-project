<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitWay - Emergency Admin Setup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            font-family: 'Segoe UI', system-ui, sans-serif; color: #fff;
        }
        .setup-card {
            background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 24px; padding: 40px; width: 480px; max-width: 95vw;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5); backdrop-filter: blur(20px);
        }
        .setup-card h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 6px; text-align: center; }
        .setup-card h1 i { color: #8b5cf6; margin-right: 8px; }
        .setup-card .subtitle { color: #94a3b8; font-size: 0.88rem; text-align: center; margin-bottom: 30px; font-weight: 600; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; letter-spacing: 0.5px; }
        .form-group input, .form-group select {
            width: 100%; padding: 13px 16px; border-radius: 12px; border: 1.5px solid rgba(139,92,246,0.3);
            background: rgba(15, 23, 42, 0.8); color: #fff; font-size: 0.95rem; font-weight: 600;
            outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group select:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.2); }
        .form-group input::placeholder { color: #475569; }
        .btn-create {
            width: 100%; padding: 14px; border: none; border-radius: 14px; cursor: pointer;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff;
            font-size: 1rem; font-weight: 800; transition: 0.3s; margin-top: 10px;
        }
        .btn-create:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139,92,246,0.4); }
        .btn-create:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #94a3b8; font-weight: 700; font-size: 0.85rem; text-decoration: none; }
        .back-link:hover { color: #8b5cf6; }
        .info-box { background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.2); border-radius: 12px; padding: 14px; margin-bottom: 24px; font-size: 0.82rem; color: #c4b5fd; line-height: 1.6; }
        .info-box i { color: #8b5cf6; margin-right: 6px; }
        select option { background: #1e293b; color: #fff; }
    </style>
</head>
<body>
    <div class="setup-card">
        <h1><i class="fas fa-crown"></i> Admin Setup</h1>
        <p class="subtitle">Create a new administrator account</p>

        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            This will create a fresh Auth account and link it to the admins table. Use this if your existing login isn't working.
        </div>

        <form id="setupForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="setupName" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="setupEmail" placeholder="admin@transitway.com" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="setupPhone" placeholder="+20 1XX XXX XXXX">
            </div>
            <div class="form-group">
                <label>Password (min 6 characters)</label>
                <input type="password" id="setupPassword" placeholder="Create secure password" required minlength="6">
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="setupRole">
                    <option value="Super Admin">Super Admin</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn-create" id="createBtn">
                <i class="fas fa-rocket"></i> Create Admin Account
            </button>
        </form>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        document.getElementById('setupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('createBtn');
            const name = document.getElementById('setupName').value.trim();
            const email = document.getElementById('setupEmail').value.trim();
            const phone = document.getElementById('setupPhone').value.trim();
            const password = document.getElementById('setupPassword').value;
            const role = document.getElementById('setupRole').value;

            if (!name || !email || !password) return;
            if (password.length < 6) {
                Swal.fire({ icon: 'warning', title: 'Weak Password', text: 'Password must be at least 6 characters.', background: '#1e293b', color: '#fff' });
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

            try {
                // Step 1: Delete existing admin record with same email (if any)
                await fetch(window.SUPABASE_URL + '/rest/v1/admins?email=eq.' + encodeURIComponent(email), {
                    method: 'DELETE',
                    headers: {
                        'apikey': window.SUPABASE_KEY,
                        'Authorization': 'Bearer ' + window.SUPABASE_KEY
                    }
                });

                // Step 2: Try to sign up in GoTrue Auth
                const signUpRes = await fetch(window.SUPABASE_URL + '/auth/v1/signup', {
                    method: 'POST',
                    headers: { 'apikey': window.SUPABASE_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const resText = await signUpRes.text();
                let authData = {};
                if (resText) { try { authData = JSON.parse(resText); } catch(e) {} }

                let userId = null;

                if (signUpRes.ok) {
                    userId = authData.id || (authData.user && authData.user.id);
                } else {
                    // User might already exist in Auth - try to sign in
                    if (authData.msg?.includes('already') || authData.message?.includes('already') || authData.error_code === 'user_already_exists') {
                        // Try signing in with the NEW password via a token request
                        const tokenRes = await fetch(window.SUPABASE_URL + '/auth/v1/token?grant_type=password', {
                            method: 'POST',
                            headers: { 'apikey': window.SUPABASE_KEY, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password })
                        });
                        
                        if (tokenRes.ok) {
                            const tokenData = await tokenRes.json();
                            userId = tokenData.user?.id;
                        } else {
                            // Can't sign in either - need to use admin API to update password
                            // Try to get user id from admins table
                            const lookupRes = await fetch(window.SUPABASE_URL + '/rest/v1/admins?email=eq.' + encodeURIComponent(email) + '&select=id', {
                                headers: { 'apikey': window.SUPABASE_KEY, 'Authorization': 'Bearer ' + window.SUPABASE_KEY }
                            });
                            const lookupData = await lookupRes.json();
                            
                            // Try updating password via admin API
                            if (lookupData && lookupData[0]?.id) {
                                const updatePwRes = await fetch(window.SUPABASE_URL + '/auth/v1/admin/users/' + lookupData[0].id, {
                                    method: 'PUT',
                                    headers: { 
                                        'apikey': window.SUPABASE_KEY,
                                        'Authorization': 'Bearer ' + window.SUPABASE_KEY,
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({ password: password })
                                });
                                if (updatePwRes.ok) {
                                    userId = lookupData[0].id;
                                } else {
                                    throw new Error('This email already exists in Auth but we cannot update it with the anon key. Please go to your Supabase Dashboard → Authentication → Users, find this email, and either delete or reset the password manually, then try again.');
                                }
                            } else {
                                throw new Error('Email already registered in Auth with a different password. Go to Supabase Dashboard → Authentication → Users → delete this user, then try again here.');
                            }
                        }
                    } else {
                        throw new Error(authData.msg || authData.message || 'Auth signup failed');
                    }
                }

                if (!userId) {
                    throw new Error('Could not retrieve user ID. If email confirmation is enabled in Supabase, please disable it: Supabase Dashboard → Authentication → Settings → Confirm Email → OFF');
                }

                // Step 3: Insert into admins table
                const insertRes = await fetch(window.SUPABASE_URL + '/rest/v1/admins', {
                    method: 'POST',
                    headers: {
                        'apikey': window.SUPABASE_KEY,
                        'Authorization': 'Bearer ' + window.SUPABASE_KEY,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        id: userId,
                        full_name: name,
                        email: email,
                        phone_number: phone,
                        password_hash: password,
                        status: 'Active',
                        role: role
                    })
                });

                if (!insertRes.ok) {
                    const errBody = await insertRes.json().catch(() => ({}));
                    // If duplicate key, try upsert
                    if (errBody.code === '23505' || (errBody.message && errBody.message.includes('duplicate'))) {
                        await fetch(window.SUPABASE_URL + '/rest/v1/admins?id=eq.' + userId, {
                            method: 'PATCH',
                            headers: {
                                'apikey': window.SUPABASE_KEY,
                                'Authorization': 'Bearer ' + window.SUPABASE_KEY,
                                'Content-Type': 'application/json',
                                'Prefer': 'return=representation'
                            },
                            body: JSON.stringify({
                                full_name: name,
                                email: email,
                                phone_number: phone,
                                password_hash: password,
                                status: 'Active',
                                role: role
                            })
                        });
                    } else {
                        throw new Error(errBody.message || 'Failed to insert admin');
                    }
                }

                await Swal.fire({
                    icon: 'success',
                    title: 'Account Ready! 🎉',
                    html: `<p style="font-weight:700;">Email: <span style="color:#8b5cf6;">${email}</span></p>
                           <p style="font-size:0.85rem;color:#94a3b8;margin-top:8px;">Redirecting to login page...</p>`,
                    timer: 3000,
                    timerProgressBar: true,
                    showConfirmButton: false,
                    background: '#1e293b',
                    color: '#fff'
                });

                window.location.href = 'index.html';

            } catch (err) {
                console.error('Setup error:', err);
                Swal.fire({
                    icon: 'error',
                    title: 'Setup Failed',
                    text: err.message,
                    background: '#1e293b',
                    color: '#fff',
                    confirmButtonColor: '#ef4444'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-rocket"></i> Create Admin Account';
            }
        });
    </script>
</body>
</html>
