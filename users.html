<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitWay - User Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard-style.css?v=20.5">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="i18n.js?v=1.1"></script>
    <script src="user-dropdown.js"></script>
    <script>
        const savedTheme = localStorage.getItem('siteTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <style>
        .users-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .users-header h2 { font-size: 1.5rem; font-weight: 900; }
        .users-stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .users-stat-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 15px; box-shadow: var(--card-shadow); transition: all 0.3s; }
        .users-stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .users-stat-icon { width: 50px; height: 50px; border-radius: 14px; background: rgba(59, 130, 246, 0.1); color: #3b82f6; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
        .users-stat-info h4 { font-size: 1.6rem; font-weight: 900; margin: 0; color: var(--text-main); }
        .users-stat-info p { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin: 2px 0 0 0; }

        
        .user-search-bar {
            display: flex; align-items: center; gap: 12px;
            background: var(--bg-card); border: 1px solid var(--border-color);
            padding: 10px 18px; border-radius: 14px; margin-bottom: 20px; max-width: 400px;
        }
        .user-search-bar i { color: var(--text-muted); }
        .user-search-bar input {
            border: none; background: transparent; outline: none;
            color: var(--text-main); font-weight: 600; font-size: 0.9rem; flex: 1;
        }

        
        .users-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }
        .user-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 24px; transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        .user-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
        .user-card.banned { border-color: rgba(239,68,68,0.3); }
        .user-card.banned::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #ef4444, #f97316);
        }

        .user-card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
        .user-avatar {
            width: 52px; height: 52px; border-radius: 50%;
            border: 3px solid var(--primary-color); object-fit: cover;
            flex-shrink: 0;
        }
        .user-card.banned .user-avatar { border-color: #ef4444; }
        .user-info-block { flex: 1; min-width: 0; }
        .user-name { font-weight: 800; font-size: 1rem; margin: 0; }
        .user-email { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .user-badge {
            padding: 4px 12px; border-radius: 20px; font-size: 0.7rem;
            font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .badge-active { background: rgba(16,185,129,0.1); color: #10b981; }
        .badge-banned { background: rgba(239,68,68,0.1); color: #ef4444; }
        .badge-warned { background: rgba(245,158,11,0.1); color: #f59e0b; }

        .user-details {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            background: var(--bg-main); padding: 14px; border-radius: 12px; margin-bottom: 16px;
        }
        .user-detail-item { display: flex; flex-direction: column; gap: 3px; }
        .user-detail-item label { font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .user-detail-item span { font-size: 0.85rem; font-weight: 700; color: var(--text-main); }

        .user-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .user-action-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 14px; border-radius: 10px; border: none;
            font-weight: 700; font-size: 0.78rem; cursor: pointer;
            transition: all 0.2s; font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .user-action-btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .user-action-btn:active { transform: scale(0.95); }
        .btn-warn { background: rgba(245,158,11,0.1); color: #f59e0b; border: 1px solid rgba(245,158,11,0.2); }
        .btn-ban { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
        .btn-unban { background: rgba(16,185,129,0.1); color: #10b981; border: 1px solid rgba(16,185,129,0.2); }
        .btn-info { background: rgba(59,130,246,0.1); color: #3b82f6; border: 1px solid rgba(59,130,246,0.2); }

        
        .users-loading {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 60px; color: var(--text-muted);
        }
        .users-loading i { font-size: 2.5rem; margin-bottom: 15px; opacity: 0.4; }

        @media (max-width: 700px) {
            .users-grid { grid-template-columns: 1fr; }
            .users-stats-bar { grid-template-columns: repeat(2, 1fr); }
        }

        @keyframes highlight-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(16,185,129,0.3); }
            50% { box-shadow: 0 0 40px rgba(16,185,129,0.6); }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="11fc662484192f59b3906d1d5669228f9f707453.png" alt="Logo">
                <h1>TRANSITWAY</h1>
            </div>
            <nav class="nav-group">
                <a href="dashboard.html" data-i18n="dashboard" class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="map.html" data-i18n="live_map" class="nav-link"><i class="fas fa-map-marked-alt"></i> Live Map</a>
                <a href="admins.html" data-i18n="admins" class="nav-link"><i class="fas fa-user-shield"></i> Admins</a>
                <a href="buses.html" data-i18n="buses" class="nav-link"><i class="fas fa-bus"></i> Buses</a>
                <a href="drivers.html" data-i18n="drivers" class="nav-link"><i class="fas fa-users"></i> Drivers</a>
                <a href="stations.html" data-i18n="stations" class="nav-link"><i class="fas fa-map-marker-alt"></i> Stations</a>
                <a href="tickets.html" data-i18n="tickets" class="nav-link"><i class="fas fa-ticket-alt"></i> Tickets</a>
                <a href="routes.html" data-i18n="routes" class="nav-link"><i class="fas fa-route"></i> Routes</a>
                <a href="reports.html" data-i18n="reports" class="nav-link"><i class="fas fa-exclamation-triangle"></i> Reports</a>
                <a href="users.html" data-i18n="users" class="nav-link active"><i class="fas fa-user-friends"></i> Users</a>
            </nav>
            <div class="sidebar-footer">
                <nav class="nav-group">
                    <a href="settings.html" data-i18n="settings" class="nav-link"><i class="fas fa-cog"></i> Settings</a>
                    <a onclick="confirmLogout()" data-i18n="logout" class="nav-link" style="cursor:pointer; color:#ef4444;"><i class="fas fa-sign-out-alt"></i> Log Out</a>
                </nav>
            </div>
        </aside>

        
        <main class="main-viewport">
            <header class="top-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                    <h2>User Management</h2>
                </div>
                <div class="header-right">
                    <div class="profile-pill dropdown-trigger">
                        <img id="topAvatar" src="https://ui-avatars.com/api/?name=Admin&background=568e74&color=fff">
                        <span id="topBarName">Admin</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </header>

            
            <div class="users-stats-bar" id="usersStats">
                <div class="users-stat-card">
                    <div class="users-stat-icon"><i class="fas fa-users"></i></div>
                    <div class="users-stat-info">
                        <h4 id="statTotalUsers">0</h4>
                        <p>Total Users</p>
                    </div>
                </div>
                <div class="users-stat-card">
                    <div class="users-stat-icon" style="background:rgba(16,185,129,0.1);color:#10b981;"><i class="fas fa-user-check"></i></div>
                    <div class="users-stat-info">
                        <h4 id="statActiveUsers">0</h4>
                        <p>Active</p>
                    </div>
                </div>
                <div class="users-stat-card">
                    <div class="users-stat-icon" style="background:rgba(239,68,68,0.1);color:#ef4444;"><i class="fas fa-user-slash"></i></div>
                    <div class="users-stat-info">
                        <h4 id="statBannedUsers">0</h4>
                        <p>Banned</p>
                    </div>
                </div>
                <div class="users-stat-card">
                    <div class="users-stat-icon" style="background:rgba(245,158,11,0.1);color:#f59e0b;"><i class="fas fa-exclamation-triangle"></i></div>
                    <div class="users-stat-info">
                        <h4 id="statWarnedUsers">0</h4>
                        <p>Warned</p>
                    </div>
                </div>
            </div>

            
            <div class="user-search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="userSearchInput" placeholder="Search users by name, email or phone...">
            </div>

            <div class="users-grid" id="usersGrid">
                <div class="users-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    Loading users...
                </div>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth.js"></script>
    <script src="users-logic.js?v=2.0"></script>
    <script src="notifications.js?v=2.0"></script>
</body>
</html>
