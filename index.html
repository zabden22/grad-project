<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitWay - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css?v=1.2">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="theme-init.js"></script>
</head>
<body>

    <button id="themeToggle" class="auth-theme-toggle" title="Toggle Theme">
        <i class="fas fa-moon"></i>
    </button>
    <button id="langToggle" class="auth-theme-toggle" title="Toggle Language" style="right: 80px;">
        <i class="fas fa-language"></i>
    </button>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="form-side">
                <div class="brand-header">
                    <img src="11fc662484192f59b3906d1d5669228f9f707453.png" alt="TransitWay" class="main-logo">
                </div>

                <div class="login-box">
                    <h1>Login your account</h1>
                    <p class="subtitle">Login to explore</p>

                    <form id="loginForm">
                        <div class="input-container">
                            <i class="far fa-envelope"></i>
                            <input type="email" placeholder="Email" id="email" required>
                        </div>

                        <div class="input-container">
                            <i class="fas fa-lock"></i>
                            <input type="password" placeholder="Password" id="password" required>
                            <i class="far fa-eye toggle-pass" onclick="togglePassword('password')"></i>
                        </div>

                        <div class="forgot-link">
                            <a href="forgot.html">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn-continue">
                            Continue <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>

                    <div id="setupSection" style="display:none;" class="setup-info-box">
                        <p>
                            <i class="fas fa-info-circle"></i> No admin accounts found. Create your first one:
                        </p>
                        <button type="button" id="setupFirstAdminBtn" class="btn-continue" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9); font-size: 0.9rem;">
                            <i class="fas fa-crown"></i> Setup First Super Admin
                        </button>
                    </div>

                    <div class="social-section">
                        <span>Sign in With</span>
                        <div class="social-icons">
                            <a href="#" id="googleLoginBtn" title="Google"><i class="fab fa-google"></i></a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="image-side">
                <div class="gov-header">
                    <img src="aad2dd876dee8682b5a218c7eae46b04e55935c5.png" alt="Government" class="gov-logo-img">
                </div>

                <div class="illustration-box">
                    <img src="f0e581ed0be66f0c6c4d016a77f0e50dccf1a06f.png" alt="Illustration">
                </div>

                <div class="glass-welcome">
                    <h3>Welcome to the community</h3>
                    <p>Login to explore the system</p>
                    <div class="pagination-dots">
                        <span></span><span></span><span class="active"></span><span></span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="login.js?v=1777561308171"></script>
    <script src="i18n.js"></script>
</body>
</html>
