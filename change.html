<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitWay - Change Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="change.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="theme-init.js"></script>
    
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="form-side">
                <div class="brand-header">
                    <img src="11fc662484192f59b3906d1d5669228f9f707453.png" alt="TransitWay" class="main-logo">
                </div>

                <div class="login-box">
                    <button class="back-btn" onclick="window.history.back()">
                        <i class="fas fa-chevron-left"></i> Back
                    </button>
                    
                    <h1>Set New Password</h1>
                    <p class="subtitle">Enter the 6-digit code we sent you and your new password.</p>

                    <form id="changePasswordForm">
                        <div class="otp-container" style="display: flex; gap: 10px; justify-content: center; margin-bottom: 25px;">
                            <input type="text" maxlength="1" class="otp-input" style="width: 40px; height: 50px; text-align: center; font-size: 1.5rem; border-radius: 8px; border: 1px solid #cbd5e1; background: var(--bg-card); color: var(--text-main);">
                            <input type="text" maxlength="1" class="otp-input" style="width: 40px; height: 50px; text-align: center; font-size: 1.5rem; border-radius: 8px; border: 1px solid #cbd5e1; background: var(--bg-card); color: var(--text-main);">
                            <input type="text" maxlength="1" class="otp-input" style="width: 40px; height: 50px; text-align: center; font-size: 1.5rem; border-radius: 8px; border: 1px solid #cbd5e1; background: var(--bg-card); color: var(--text-main);">
                            <input type="text" maxlength="1" class="otp-input" style="width: 40px; height: 50px; text-align: center; font-size: 1.5rem; border-radius: 8px; border: 1px solid #cbd5e1; background: var(--bg-card); color: var(--text-main);">
                            <input type="text" maxlength="1" class="otp-input" style="width: 40px; height: 50px; text-align: center; font-size: 1.5rem; border-radius: 8px; border: 1px solid #cbd5e1; background: var(--bg-card); color: var(--text-main);">
                            <input type="text" maxlength="1" class="otp-input" style="width: 40px; height: 50px; text-align: center; font-size: 1.5rem; border-radius: 8px; border: 1px solid #cbd5e1; background: var(--bg-card); color: var(--text-main);">
                        </div>
                        <div class="input-container">
                            <i class="fas fa-lock"></i>
                            <input type="password" placeholder="New Password" id="newPass" required>
                            <i class="far fa-eye toggle-pass" onclick="togglePassword('newPass')"></i>
                        </div>

                        <div class="input-container">
                            <i class="fas fa-check-circle"></i>
                            <input type="password" placeholder="Confirm Password" id="confirmPass" required>
                            <i class="far fa-eye toggle-pass" onclick="togglePassword('confirmPass')"></i>
                        </div>

                        <button type="submit" class="btn-continue">Reset Password</button>
                    </form>

                    <p class="resend-text" style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--change-subtitle);">
                        Didn't receive the code? <a href="#" onclick="resendCode(event)" style="color: #76a08a; font-weight: 700; text-decoration: none;">Resend Code</a>
                    </p>
                </div>
            </div>
            
            <div style="position: absolute; top: 20px; right: 20px; z-index: 100;">
                <button id="themeToggle" style="background: var(--change-input-bg); border: 1px solid var(--change-input-border); color: var(--change-text); width: 45px; height: 45px; border-radius: 12px; cursor: pointer; transition: 0.3s;">
                    <i class="fas fa-moon"></i>
                </button>
            </div>

            <div class="image-side">
                <div class="gov-header">
                    <img src="aad2dd876dee8682b5a218c7eae46b04e55935c5.png" alt="Government" class="gov-logo-img">
                </div>

                <div class="illustration-box">
                    <img src="c6bc24ce6ce5646be98a1b2706a043336062c044.png" alt="Reset Password Illustration">
                </div>

                <div class="glass-welcome">
                    <h3>Security First!</h3>
                    <p>Make sure your new password is strong and contains a mix of letters, numbers, and symbols.</p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="change.js?v=1.1"></script>
    <script src="notifications.js?v=2.0"></script>
</body>
</html>
